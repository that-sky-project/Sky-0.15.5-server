# ============================================================================
# 光遇私服 wbsky · 实时面板域名反代（可选）
#   站点：live.admin.xyz  →  同一个 wbsky 主服务（127.0.0.1:2007）
#
# 为什么单独一个域名：
#   /live 面板看得到在线玩家的**位置和聊天原文**，虽然 live_panel.py 自己
#   带 HTTP Basic 鉴权（口令在 deploy/.env 的 WB_SKY_LIVE_PASSWORD），
#   但把管理界面和游戏 API 放在同一个域名上，等于把面板暴露给所有玩家。
#   单独一个域名 + 1Panel 里再加一层 Basic 认证，是双保险。
#
# 不想暴露到公网？那**不要**用这个文件，直接走 SSH 隧道：
#     ssh -L 2007:127.0.0.1:2007 root@103.24.218.98
#   然后本机开 http://127.0.0.1:2007/live
#
# 【装法】同 beta.admin.xyz.conf：
#     cp deploy/nginx/live.admin.xyz.conf \
#        /opt/1panel/www/sites/live.admin.xyz/proxy/skywb-live.conf
# ============================================================================

server {
    listen 80;
    server_name live.admin.xyz;
    client_max_body_size 32m;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name live.admin.xyz;
    client_max_body_size 32m;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ---- 额外一层 Basic 认证（可选，删掉这两行就只剩面板自己的口令）----
    # 生成密码文件：
    #   apt install -y apache2-utils
    #   htpasswd -c /opt/1panel/www/sites/live.admin.xyz/.htpasswd admin
    # 然后放开下面两行：
    # auth_basic           "skywb live panel";
    # auth_basic_user_file /opt/1panel/www/sites/live.admin.xyz/.htpasswd;

    location / {
        proxy_pass __BACKEND_SCHEME__://127.0.0.1:__HTTPS_PORT__;
__BACKEND_SSL__
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
