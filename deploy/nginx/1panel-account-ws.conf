# ============================================================================
# 只补 /account/ws 的片段（给 1Panel 面板建的站点用）
# ----------------------------------------------------------------------------
# 【为什么需要这个文件】
#   1Panel 面板创建/更新站点后会**重新生成**站点主配置，里面只有一条
#       location ^~ / { proxy_pass ...; }
#   于是 /account/ws 的 WebSocket 请求会被打到 Flask（不支持 WS）→
#   客户端拿 400 → 聊天「发出去连自己都看不到」。
#   而直接改站点主配置会被面板重建时覆盖掉。
#
#   正确做法：放进站点的 proxy 子目录。站点主配置里本来就有
#       include /www/sites/<域名>/proxy/*.conf;
#   放进去就自动加载，面板重建也不会丢。
#
# 【装法】
#   cp deploy/nginx/1panel-account-ws.conf \
#      /opt/1panel/www/sites/beta.admin.xyz/proxy/account-ws.conf
#   docker exec 1Panel-openresty-XXXX nginx -t && \
#   docker exec 1Panel-openresty-XXXX nginx -s reload
#
# 【自检】必须回 101：
#   curl -i -N -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
#        -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
#        -H 'Sec-WebSocket-Version: 13' \
#        https://beta.admin.xyz/account/ws
# ============================================================================

location ^~ /account/ws {
    # ★ 后端是**独立的 ws 容器**，映射到宿主机 2500。
    #   1Panel 的 OpenResty 不在本项目的 compose 网络里，
    #   所以必须写宿主机地址 127.0.0.1，写容器名 wbsky-ws 会 502。
    proxy_pass http://127.0.0.1:2500;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WS 是长连接：超时给足，否则聊到一半被网关掐断
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
