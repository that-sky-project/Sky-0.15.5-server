# ============================================================================
# 光遇私服 wbsky · 主域名反代
#   站点：beta.admin.xyz  →  wbsky 主服务（宿主机 127.0.0.1:2007）
#                              + /account/ws → 聊天 WS（宿主机 127.0.0.1:2500）
# ----------------------------------------------------------------------------
# 【这个文件解决的就是「反代了还是 502」和「聊天发不出去」】
#
# 1) 后端到底是 https 还是 http，必须和反代对上
#    wbsky/index.py 的规则：wbsky/fullchain.pem + privkey.key 都在 → 起 HTTPS；
#    否则起明文 HTTP。**默认部署（包里没证书）后端是明文**，所以这里用
#    http://；如果你跑了 deploy/make-cert.sh 生成了证书，就要把它改成
#    https:// 并**必须**加上 proxy_ssl_verify off;（自签证书校验不过同样 502）。
#    下面的 __BACKEND_SCHEME__ / __BACKEND_SSL__ 由 deploy/install-nginx.sh 自动
#    探测后替换，你手改的话直接写 http 或 https 即可。
#
# 2) 后端地址必须写 127.0.0.1:端口，**不要写容器名**
#    1Panel 的 OpenResty 是**单独一个容器**，它不在本项目的 compose 网络里，
#    写 `proxy_pass http://wbsky:2007;` 会直接解析失败（502）。
#    容器名 wbsky / wbsky-udp / wbsky-ws 只在本 compose 网络内部有效，
#    给面板里的 nginx 用一律走宿主机映射端口 127.0.0.1。
#    （老包的 nginx-hk.conf 就是因为写成 server:2007 而全程 502。）
#
# 3) /account/ws 必须**单独**配，且带 Upgrade 头
#    不配的话请求会落到 Flask（Flask 不支持 WS）→ 客户端拿到 400 →
#    聊天「发出去连自己都看不到」。WS 是长连接，超时也要给足。
#
# 【怎么装】
#   方式 A（推荐，脚本代劳）：bash deploy/install-nginx.sh
#   方式 B（手工）：把本文件复制到 1Panel 站点的 proxy 子目录：
#          /opt/1panel/www/sites/<域名>/proxy/skywb.conf
#        站点主配置里本来就有 `include /www/sites/<域名>/proxy/*.conf;`
#        然后：docker exec 1Panel-openresty-XXXX nginx -t && nginx -s reload
#        （容器名用 docker ps 查，找 1Panel-openresty-*）
#
# 【自检】必须回 101，回 400/404/502 都不对：
#   curl -i -N -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
#        -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
#        -H 'Sec-WebSocket-Version: 13' \
#        https://beta.admin.xyz/account/ws
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name beta.admin.xyz;
    client_max_body_size 32m;

    # 1Panel 申请/续期证书时的 ACME 校验必须放行
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name beta.admin.xyz;
    client_max_body_size 32m;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ---- APK / 客户端更新包直链（可选） ----
    # wbsky/route/client.py 的 /client/version 默认下发
    #   http://<域名>/dl/sky.apk   （client_apk_port 默认 80）
    # 把安装包放到这个目录即可；不用这个功能就删掉这一段。
    location /dl/ {
        alias /opt/1panel/www/sites/beta.admin.xyz/dl/;
        autoindex on;
        autoindex_exact_size off;
        types { text/html html htm; }
        default_type application/octet-stream;
        sendfile on;
    }

    # ---- 聊天 WebSocket：必须单独配 ----
    location = /account/ws {
        proxy_pass __BACKEND_SCHEME__://127.0.0.1:__WS_PORT__;
__BACKEND_SSL__
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        # WS 是长连接：超时给足，否则聊到一半被网关掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- 其余全部交给 Flask（游戏 API） ----
    location / {
        proxy_pass __BACKEND_SCHEME__://127.0.0.1:__HTTPS_PORT__;
__BACKEND_SSL__
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 客户端启动那一下要拉一堆配置，读超时别太短
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
