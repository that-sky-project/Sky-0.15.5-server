# ============================================================================
# 光遇私服 wbsky · 管理后台域名反代（可选）
#   站点：admin.admin.xyz  →  同一个 wbsky 主服务（127.0.0.1:2007）
#
# 【为什么建议单独一个域名】
#   /admin 是**可写**的后台（改蜡烛、发货币、删账号、改好友关系），
#   /live 只是只读的实时面板。把可写后台和游戏 API 放在同一个域名上，
#   等于给所有玩家多开了一扇门。
#   单独域名 + 1Panel 里再加一层 Basic 认证，是双保险。
#
# 【更安全的做法：根本不对公网开放】
#   不要用这个文件，直接走 SSH 隧道：
#       ssh -L 2007:127.0.0.1:2007 root@103.24.218.98
#   然后本机开 http://127.0.0.1:2007/admin
#   —— 云安全组里 2007 只放行你自己的 IP 也能达到同样效果。
#
# 【装法】
#   bash deploy/install-nginx.sh        （会一并装上本文件，前提是站点已建好）
#   手工：cp deploy/nginx/admin.admin.xyz.conf \
#            /opt/1panel/www/sites/admin.admin.xyz/proxy/skywb-admin.conf
#
# 【安全提醒】
#   面板本身有登录（config.json 的 admin_user/admin_password，会话 12 小时），
#   但**没有 CSRF token**。对公网开放时请务必：
#     1) 改掉默认口令（.env 的 WB_SKY_ADMIN_PASSWORD）
#     2) 在下面放开 Basic 认证那两行
#     3) 或者干脆只走隧道，不用这个站点
# ============================================================================

server {
    listen 80;
    server_name admin.admin.xyz;
    client_max_body_size 32m;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.admin.xyz;
    client_max_body_size 32m;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ---- 额外一层 Basic 认证（建议放开）----
    # 生成密码文件：
    #   apt install -y apache2-utils
    #   htpasswd -c /opt/1panel/www/sites/admin.admin.xyz/.htpasswd admin
    # auth_basic           "skywb admin";
    # auth_basic_user_file /opt/1panel/www/sites/admin.admin.xyz/.htpasswd;

    location / {
        proxy_pass __BACKEND_SCHEME__://127.0.0.1:__HTTPS_PORT__;
__BACKEND_SSL__
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 后台有些操作要等数据库，读超时给足
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
