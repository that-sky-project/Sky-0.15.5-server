; =====================================================================
; 联机房间服（Node sky0155-udp，ENet/UDP）—— supervisor / 1Panel 原生部署用
; ---------------------------------------------------------------------
; 【怎么装】
;   APP=/opt/1panel/apps/skywb
;   cd $APP/sky0155-udp && npm install      # sky-enet 是原生模块，要现场编译
;   cp deploy/supervisor/sky0155-udp.ini /opt/1panel/tools/supervisord/supervisord.d/
;   supervisorctl reread && supervisorctl update
;
; 【端口】
;   真正 listen 的端口 = 环境变量 WB_SKY_UDP_PORT（下面是 19458），
;   没有这个变量时回退到 sky0155-udp/config.json 的 udp_server_port。
;   ⚠️ 这个值必须和 wbsky/config.json 的 udp_server_port、以及
;      deploy/.env 的 UDP_PORT **三者一致**。
;      不一致的症状：能登录、能进图，但**看不到其他玩家**，且日志无报错。
;      （deploy/check.sh 和启动自检都会告警这一项。）
;
; 【/health 与 /stats】
;   端口由 WB_SKY_UDP_HTTP_PORT 决定（下面 11925），只给本机排障用：
;       curl http://127.0.0.1:11925/health
;       curl http://127.0.0.1:11925/stats
;   面板 wbsky/live_panel.py 读的就是这个地址（原生部署时用 127.0.0.1）。
; =====================================================================

[program:sky0155-udp]
command                 = /usr/bin/node src/main.js
directory               = /opt/1panel/apps/skywb/sky0155-udp
autorestart             = true
autostart               = true
startsecs               = 5
stopasgroup             = true
killasgroup             = true
stdout_logfile          = /opt/1panel/tools/supervisord/log/sky0155-udp.out.log
stderr_logfile          = /opt/1panel/tools/supervisord/log/sky0155-udp.err.log
stdout_logfile_maxbytes = 20MB
stderr_logfile_maxbytes = 20MB
user                    = root
priority                = 999
numprocs                = 1
process_name            = %(program_name)s_%(process_num)02d
environment             = NODE_ENV="production",WB_SKY_UDP_PORT="19458",WB_SKY_UDP_HOST="0.0.0.0",WB_SKY_UDP_HTTP_PORT="11925"
