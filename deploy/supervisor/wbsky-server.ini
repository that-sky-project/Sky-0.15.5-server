; =====================================================================
; wbsky 主服务（Flask index.py）—— supervisor / 1Panel 原生部署用
; ---------------------------------------------------------------------
; 【什么时候用这个文件】
;   本包**推荐 Docker Compose 部署**（见 deploy/docker-compose.yml），
;   那种方式不需要 supervisor。
;   这个文件是给"宿主机原生部署"用的 —— 即 1Panel → 进程守护(supervisor)
;   里托管，跟你原来那台机器一样。
;
; 【怎么装】
;   APP=/opt/1panel/apps/skywb
;   cp deploy/supervisor/wbsky-server.ini /opt/1panel/tools/supervisord/supervisord.d/
;   supervisorctl reread && supervisorctl update
;
; 【前置：venv】
;   cd $APP && python3.10 -m venv venv
;   ./venv/bin/pip install -r deploy/requirements.txt
;
; 【路径说明】
;   原来是 /wbsky（跟项目根同名，容易混）。现在统一成项目根下的 wbsky/ 子目录，
;   由下面的 directory= 指定工作目录，index.py 里用的是相对路径，
;   所以工作目录必须是 wbsky/。
;
; 【环境变量】
;   原生部署时 PYTHONPATH 指到 deploy/ 才能加载 sitecustomize.py
;   （端口/监听地址/面板口令/建库容错都在它里面）。
;   变量值建议从 deploy/.env 抄一份到下面的 environment= 里。
; =====================================================================

[program:wbsky-server]
command                 = /opt/1panel/apps/skywb/venv/bin/python -u index.py
directory               = /opt/1panel/apps/skywb/wbsky
autorestart             = true
autostart               = true
startsecs               = 5
stopasgroup             = true
killasgroup             = true
stdout_logfile          = /opt/1panel/tools/supervisord/log/wbsky-server.out.log
stderr_logfile          = /opt/1panel/tools/supervisord/log/wbsky-server.err.log
stdout_logfile_maxbytes = 20MB
stderr_logfile_maxbytes = 20MB
user                    = root
priority                = 999
numprocs                = 1
process_name            = %(program_name)s_%(process_num)02d
; ↓ 原生部署时把这几项按 deploy/.env 填好（MYSQL_* 指向宿主机 127.0.0.1）
environment             = PYTHONPATH="/opt/1panel/apps/skywb/deploy",WB_SKY_HTTP_PORT="2007",WB_SKY_BIND="0.0.0.0",WB_SKY_DEBUG="0",WB_SKY_UDP_HOST="103.24.218.98",WB_SKY_UDP_PORT="19458",WB_SKY_UDP_STATS_URL="http://127.0.0.1:11925/stats",WB_SKY_WS_OUTBOX="/opt/1panel/apps/skywb/wbsky/logs/ws_outbox.jsonl",WB_SKY_LIVE_USER="admin",WB_SKY_LIVE_PASSWORD="admin123",WB_SKY_USE_MYSQL="1",MYSQL_HOST="127.0.0.1",MYSQL_PORT="3306",MYSQL_USER="wbsky",MYSQL_PASSWORD="SkyServer2026!",MYSQL_DATABASE="skygame",MYSQL_CHARSET="utf8mb4",WB_SKY_SCHEMA_RESILIENT="1",WB_SKY_DB_RETRY="3"
