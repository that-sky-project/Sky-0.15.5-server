; =====================================================================
; wbsky 聊天 WebSocket 中继（ws_server.py，默认 2500）—— supervisor 用
; ---------------------------------------------------------------------
; 为什么必须是**独立进程**：
;   Flask 的 /account/chat/send 把要广播的聊天帧追加到
;       wbsky/logs/ws_outbox.jsonl
;   本进程 tail 这个文件并推给所有已连上的客户端（跨进程总线）。
;   客户端走的是 GET /account/ws（带 Basic 认证），nginx 把这一条路径
;   反代到本进程 —— 不配这条反代的话请求会落到 Flask（不支持 WS），
;   客户端拿 400，"聊天发出去自己都看不到"。
;
; 【怎么装】
;   cp deploy/supervisor/wbsky-ws.ini /opt/1panel/tools/supervisord/supervisord.d/
;   supervisorctl reread && supervisorctl update
;
; 【注意工作目录】
;   ws_server.py 用相对自身位置找 logs/ 和 config/ws_options.json，
;   所以 directory= 必须是 wbsky/。
; =====================================================================

[program:wbsky-ws]
command                 = /opt/1panel/apps/skywb/venv/bin/python -u ws_server.py 2500
directory               = /opt/1panel/apps/skywb/wbsky
autorestart             = true
autostart               = true
startsecs               = 3
stopasgroup             = true
killasgroup             = true
stdout_logfile          = /opt/1panel/tools/supervisord/log/wbsky-ws.out.log
stderr_logfile          = /opt/1panel/tools/supervisord/log/wbsky-ws.err.log
stdout_logfile_maxbytes = 10MB
stderr_logfile_maxbytes = 10MB
user                    = root
priority                = 999
numprocs                = 1
process_name            = %(program_name)s_%(process_num)02d
