# ============================================================================
# 【历史文件 · 仅作参考】
# ----------------------------------------------------------------------------
# 这是上一版（原生部署 + 反代）的 nginx 站点配置。它有两个必须注意的点：
#
#   1) proxy_pass 写的是容器/服务名 server:2999 / ws:9002。
#      这在**同一个 docker compose 网络内部**才解析得到。
#      这份配置若放进 1Panel 的 OpenResty（**独立容器**）里用，
#      会直接解析失败 -> 全程 502。
#      （原生部署或 1Panel 反代，必须写 127.0.0.1:2999。）
#
#   2) 它没有证书路径占位、也没有 ACME 放行段。
#
# ★ 现在请改用 deploy/nginx/ 下这三个文件（含完整的端口与协议说明）：
#     deploy/nginx/beta.admin.xyz.conf    主域名（游戏 API + /account/ws）
#     deploy/nginx/live.admin.xyz.conf    实时面板域名
#     deploy/nginx/1panel-account-ws.conf    只补 /account/ws 的片段
#   一键安装：bash deploy/install-nginx.sh
#
# 这份文件保留只为对照以前是怎么配的，不要直接拷到 1Panel 里用。
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # APK 直链（http 也放通，避免自签证书导致手机下载失败）
    location /dl/ {
        alias /usr/share/nginx/downloads/;
        index index.html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        types { text/html html htm; }
        default_type application/octet-stream;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # APK 直链下载（静态文件，支持断点续传）
    location /dl/ {
        alias /usr/share/nginx/downloads/;
        index index.html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        types { text/html html htm; }
        default_type application/octet-stream;
        sendfile on;
        tcp_nopush on;
    }

    # WebSocket：聊天/消息通道
    location = /account/ws {
        proxy_pass http://ws:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余全部交给 Flask
    location / {
        proxy_pass http://server:2999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
